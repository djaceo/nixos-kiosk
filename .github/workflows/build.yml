name: Build NixOS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build ISO
        run: |
          nix build .#nixosConfigurations.kiosk.config.system.build.isoImage

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nixos-kiosk-x86_64
          path: result/iso/*.iso
